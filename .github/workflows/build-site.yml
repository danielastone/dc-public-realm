name: Build and deploy alpha site

on:
  push:
    branches: [main]
    paths: ['data/**','transactions/**','migrations/**','skills/**','scripts/**','.github/workflows/build-site.yml']
  pull_request:
    paths: ['data/**','transactions/**','migrations/**','skills/**','scripts/**','.github/workflows/build-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate frozen migration baseline
        run: python scripts/validate_data.py
      - name: Validate scholarly claim modes
        run: python scripts/validate_claim_modes.py
      - name: Validate overview data
        run: python scripts/validate_overview_data.py
      - name: Validate localization integrity
        run: python scripts/validate_localization.py
      - name: Validate public image rights metadata
        run: python scripts/validate_image_rights.py
      - name: Validate image provenance URLs
        run: python scripts/check_image_urls.py
      - name: Validate EPI-002 dependency derivation
        run: python scripts/validate_epi002_dependency_derivation.py
      - name: Validate EPI-004 lineage traversal
        run: python scripts/validate_epi004_lineage_traversal.py
      - name: Audit EPI-004 real corpus lineage
        run: python scripts/validate_epi004_corpus_lineage.py
      - name: Inventory EPI-005 canonical material conflicts
        run: python scripts/validate_epi005_conflict_inventory.py
      - name: Validate EPI-005 synthetic conflict semantics
        run: python scripts/validate_epi005_synthetic_rendering.py
      - name: Validate DATA-001 synthetic reconciliation semantics
        run: python scripts/validate_data001_synthetic.py
      - name: Materialize transaction database
        run: python scripts/build_database.py
      - name: Validate materialized database
        env: {KNOWLEDGE_DATA_DIR: build/data}
        run: python scripts/validate_data.py
      - name: Validate materialized publication identity
        env: {KNOWLEDGE_DATA_DIR: build/data}
        run: python scripts/validate_publication_identity.py
      - name: Validate publication index contract
        env: {KNOWLEDGE_DATA_DIR: build/data}
        run: python scripts/validate_publication_index.py
      - name: Validate materialized scholarly claim modes
        env: {KNOWLEDGE_DATA_DIR: build/data}
        run: python scripts/validate_claim_modes.py
      - name: Stage materialized database for publication
        run: |
          cp data/external-records.json /tmp/external-records.json
          cp data/claim-modes.json /tmp/claim-modes.json
          cp data/publication_status_rules.json /tmp/publication_status_rules.json
          cp data/publication_dependency_rules.json /tmp/publication_dependency_rules.json
          rm -rf data
          cp -R build/data data
          cp /tmp/external-records.json data/external-records.json
          cp /tmp/claim-modes.json data/claim-modes.json
          cp /tmp/publication_status_rules.json data/publication_status_rules.json
          cp /tmp/publication_dependency_rules.json data/publication_dependency_rules.json
      - name: Build publication from materialized database
        run: python scripts/build_publication.py
      - name: Validate rendered object overviews
        run: python scripts/validate_overview_rendering.py
      - name: Add Artigas external interoperability records
        run: python scripts/inject_external_records.py
      - name: Build Smithsonian Artigas review brief
        run: python scripts/build_smithsonian_review.py
      - name: Update public project front door
        run: python scripts/inject_project_frontdoor.py
      - name: Stamp canonical computed statuses onto rendered pages
        run: python scripts/stamp_publication_status.py
      - name: Publish epistemic status rule explanations
        run: python scripts/inject_status_rules.py
      - name: Publish claim-evidence dependency states
        run: python scripts/publish_dependency_state.py
      - name: Publish claim lineage traces
        run: python scripts/publish_claim_lineage.py
      - name: Publish visible material conflicts
        run: python scripts/publish_material_conflicts.py
      - name: Preserve canonical-data links after page transforms
        run: python scripts/ensure_canonical_data_links.py
      - name: Enforce shared navigation and alpha state
        run: python scripts/enforce_navigation_contract.py
      - name: Reconcile published research tasks
        run: python scripts/stamp_research_task_counts.py
      - name: Verify publication status consistency
        run: python scripts/validate_publication_consistency.py
      - name: Verify EPI-001 public status rule contract
        run: python scripts/validate_epi001_status_rules.py
      - name: Verify EPI-002 rendered dependency state
        run: python scripts/validate_epi002_dependency_rendering.py
      - name: Verify EPI-003 ancestry remains explicit
        run: python scripts/validate_epi003_ancestry_rendering.py
      - name: Verify EPI-004 rendered claim lineage
        run: python scripts/validate_epi004_rendered_lineage.py
      - name: Verify EPI-004 San Martin Daumas-Dumont conflict
        run: python scripts/validate_epi004_san_martin_conflict.py
      - name: Verify EPI-005 rendered material conflicts
        run: python scripts/validate_epi005_rendered_conflicts.py
      - name: Verify EPI-005 warning placement
        run: python scripts/validate_epi005_warning_placement.py
      - name: Verify DATA-001 exact rendered assertion reconciliation
        run: python scripts/validate_data001_assertion_reconciliation.py
      - name: Verify PUB-001 canonical-data routes
        run: python scripts/validate_pub001_routes.py
      - name: Verify PUB-002 navigation contract
        run: python scripts/validate_pub002_navigation.py
      - name: Verify PUB-003 research-task reconciliation
        run: python scripts/validate_pub003_tasks.py
      - name: Verify PUB-004 internal link integrity
        run: python scripts/validate_pub004_internal_links.py
      - name: Verify legacy required routes and audit artifact
        run: |
          test -f build/audit/manifest.json
          test -f site/index.html
          grep -q 'CURRENT PROJECT · URUGUAY' site/index.html
          grep -q 'Take part in the research' site/index.html
          grep -q 'Browse research missions' site/index.html
          grep -q 'Records may change when additional sources are reviewed' site/index.html
          test -f site/collaborate/artigas/index.html
          grep -q 'Help Research the Artigas Memorial' site/collaborate/artigas/index.html
          grep -q 'Research missions' site/collaborate/artigas/index.html
          grep -q 'What happens to your contribution' site/collaborate/artigas/index.html
          grep -q 'No specialized training is required' site/collaborate/artigas/index.html
          grep -q 'Goode (1974)' site/collaborate/artigas/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
