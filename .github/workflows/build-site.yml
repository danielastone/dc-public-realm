name: Build and deploy alpha site

on:
  push:
    branches: [main]
    paths: ['data/**','transactions/**','skills/**','scripts/**','.github/workflows/build-site.yml']
  pull_request:
    paths: ['data/**','transactions/**','skills/**','scripts/**','.github/workflows/build-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate frozen migration baseline
        run: python scripts/validate_data.py
      - name: Validate scholarly claim modes
        run: python scripts/validate_claim_modes.py
      - name: Validate overview data
        run: python scripts/validate_overview_data.py
      - name: Validate public image rights metadata
        run: python scripts/validate_image_rights.py
      - name: Validate image provenance URLs
        run: python scripts/check_image_urls.py
      - name: Materialize transaction database
        run: python scripts/build_database.py
      - name: Validate materialized database
        env: {KNOWLEDGE_DATA_DIR: build/data}
        run: python scripts/validate_data.py
      - name: Validate materialized scholarly claim modes
        env: {KNOWLEDGE_DATA_DIR: build/data}
        run: python scripts/validate_claim_modes.py
      - name: Stage materialized database for publication
        run: |
          cp data/external-records.json /tmp/external-records.json
          cp data/claim-modes.json /tmp/claim-modes.json
          cp data/object-overviews.json /tmp/object-overviews.json
          rm -rf data
          cp -R build/data data
          cp /tmp/external-records.json data/external-records.json
          cp /tmp/claim-modes.json data/claim-modes.json
          cp /tmp/object-overviews.json data/object-overviews.json
      - name: Build static alpha from materialized database
        run: python scripts/build_site.py
      - name: Build country research indexes
        run: python scripts/build_country_pages.py
      - name: Build Artigas public vertical slice
        run: python scripts/build_artigas_public.py
      - name: Add sourced object overviews
        run: python scripts/inject_object_overviews.py
      - name: Validate rendered object overviews
        run: python scripts/validate_overview_rendering.py
      - name: Add Artigas external interoperability records
        run: python scripts/inject_external_records.py
      - name: Build Smithsonian Artigas review brief
        run: python scripts/build_smithsonian_review.py
      - name: Update public project front door
        run: python scripts/inject_project_frontdoor.py
      - name: Stamp canonical computed statuses onto rendered pages
        run: python scripts/stamp_publication_status.py
      - name: Verify publication status consistency
        run: python scripts/validate_publication_consistency.py
      - name: Verify required routes and audit artifact
        run: |
          test -f build/audit/manifest.json
          test -f site/index.html
          grep -q 'CURRENT PROJECT · URUGUAY' site/index.html
          grep -q 'Take part in the research' site/index.html
          grep -q 'Browse research missions' site/index.html
          grep -q 'Records may change when additional sources are reviewed' site/index.html
          test -f site/collaborate/artigas/index.html
          grep -q 'Help Research the Artigas Memorial' site/collaborate/artigas/index.html
          grep -q 'Research missions' site/collaborate/artigas/index.html
          grep -q 'What happens to your contribution' site/collaborate/artigas/index.html
          grep -q 'No specialized training is required' site/collaborate/artigas/index.html
          grep -q 'Goode (1974)' site/collaborate/artigas/index.html
          test -f site/data/assertions.json
          test -f site/objects/jose-gervasio-artigas/index.html
          grep -q 'OBJ-0001 · URUGUAY' site/objects/jose-gervasio-artigas/index.html
          grep -q 'class="record-overview"' site/objects/jose-gervasio-artigas/index.html
          grep -q 'Constitution Avenue &amp; 18th Street NW' site/objects/jose-gervasio-artigas/index.html
          grep -q 'June 19, 1950' site/objects/jose-gervasio-artigas/index.html
          grep -q 'National Park Service' site/objects/jose-gervasio-artigas/index.html
          grep -q 'Research notes' site/objects/jose-gervasio-artigas/index.html
          grep -q 'External records' site/objects/jose-gervasio-artigas/index.html
          grep -q 'not automatically evidence' site/objects/jose-gervasio-artigas/index.html
          grep -q 'siris_ari_325679' site/objects/jose-gervasio-artigas/index.html
          grep -q 'Q15221517' site/objects/jose-gervasio-artigas/index.html
          grep -q 'n50001870' site/objects/jose-gervasio-artigas/index.html
          grep -q 'Historical record' site/objects/jose-gervasio-artigas/index.html
          grep -q 'Attribution' site/objects/jose-gervasio-artigas/index.html
          grep -q 'Source history' site/objects/jose-gervasio-artigas/index.html
          grep -q 'The source for this statement has not been established' site/objects/jose-gervasio-artigas/index.html
          grep -q 'Record data' site/objects/jose-gervasio-artigas/index.html
          grep -q 'data-assertion-id="A-0004" data-computed-status="CONTESTED"' site/objects/jose-gervasio-artigas/index.html
          grep -q 'data-assertion-id="A-0005B" data-computed-status="SUPPORTED"' site/objects/jose-gervasio-artigas/index.html
          test -f site/review/artigas/index.html
          grep -q 'Issues for review' site/review/artigas/index.html
          grep -q 'Review requested' site/review/artigas/index.html
          grep -q 'How review affects the record' site/review/artigas/index.html
          test -f site/objects/jose-de-san-martin/index.html
          test -f site/objects/cuban-american-friendship-urn/index.html
          test -f site/countries/uruguay/index.html
          test -f site/countries/argentina/index.html
          test -f site/countries/cuba/index.html
          test -f site/methodology/index.html
          grep -q 'Evidence model' site/methodology/index.html
          grep -q 'Source history' site/methodology/index.html
          grep -q 'Status rules' site/methodology/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: diplomatic-gifts-alpha-site
          path: |
            site/
            build/audit/manifest.json
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with: {path: site/}
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
