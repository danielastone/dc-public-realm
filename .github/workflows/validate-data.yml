name: Validate semantic data

on:
  push:
    paths:
      - 'data/**'
      - 'transactions/**'
      - 'migrations/**'
      - 'skills/**'
      - 'fixtures/**'
      - 'tests/fixtures/**'
      - 'schemas/**'
      - 'qualification/**'
      - 'qualifications/**'
      - 'scripts/build_database.py'
      - 'scripts/validate_data.py'
      - 'scripts/validate_publication_identity.py'
      - 'scripts/publication_index.py'
      - 'scripts/validate_publication_index.py'
      - 'scripts/validate_research_tasks.py'
      - 'scripts/validate_collaboration_lifecycle.py'
      - 'scripts/validate_epistemic_fixtures.py'
      - 'scripts/validate_source_audits.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'transactions/**'
      - 'migrations/**'
      - 'skills/**'
      - 'fixtures/**'
      - 'tests/fixtures/**'
      - 'schemas/**'
      - 'qualification/**'
      - 'qualifications/**'
      - 'scripts/build_database.py'
      - 'scripts/validate_data.py'
      - 'scripts/validate_publication_identity.py'
      - 'scripts/publication_index.py'
      - 'scripts/validate_publication_index.py'
      - 'scripts/validate_research_tasks.py'
      - 'scripts/validate_collaboration_lifecycle.py'
      - 'scripts/validate_epistemic_fixtures.py'
      - 'scripts/validate_source_audits.py'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate epistemic regression fixtures
        run: python scripts/validate_epistemic_fixtures.py
      - name: Validate real source-audit qualification outputs
        run: python scripts/validate_source_audits.py
      - name: Validate frozen migration baseline
        run: python scripts/validate_data.py
      - name: Validate collaboration epistemic targets and statuses
        run: python scripts/validate_research_tasks.py
      - name: Validate collaboration lifecycle and synthetic gates
        run: python scripts/validate_collaboration_lifecycle.py
      - name: Build transaction materialization
        run: python scripts/build_database.py
      - name: Validate materialized database
        env:
          KNOWLEDGE_DATA_DIR: build/data
        run: python scripts/validate_data.py
      - name: Validate materialized collaboration task statuses
        env:
          KNOWLEDGE_DATA_DIR: build/data
        run: python scripts/validate_research_tasks.py
      - name: Validate materialized publication identity
        env:
          KNOWLEDGE_DATA_DIR: build/data
        run: python scripts/validate_publication_identity.py
      - name: Validate publication index contract
        env:
          KNOWLEDGE_DATA_DIR: build/data
        run: python scripts/validate_publication_index.py
      - name: Verify audit manifests exist
        run: test -s build/audit/manifest.json && test -s build/audit/semantic-manifest.json
      - name: Verify deterministic semantic rebuild
        run: |
          cp build/audit/semantic-manifest.json /tmp/semantic-first.json
          python scripts/build_database.py
          cmp /tmp/semantic-first.json build/audit/semantic-manifest.json
      - name: Show semantic audit manifest
        run: cat build/audit/semantic-manifest.json
